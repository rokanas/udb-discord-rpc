[package]
name = "udb-discord-rpc"
version = "1.0.0"
edition = "2026"
description = "Discord RPC proxy launcher for Ultimate Doom Builder"
license = "GPL-3.0"

[[bin]]
name = "UltimateDoomBuilder-RPC"
path = "src/main.rs"

[dependencies]
discord-rich-presence = "0.2"
sysinfo = "0.30"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "minwindef", "windef"] }

[profile.release]
opt-level = "z"
lto = true
strip = true